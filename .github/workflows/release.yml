# Publishes a release when a version tag is pushed:
#
#   1. bump `version` in crates/launcher/Cargo.toml and commit
#   2. git tag -a v0.2.0 -m "What changed, in a sentence or two"
#   3. git push origin v0.2.0
#
# The tag message becomes the release notes shown in the launcher. The
# release gets the launcher for Windows and Linux, the standalone client jar
# and a signed update.json; exiles.dev/update.json points at the newest one,
# which is how installed launchers find it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the launcher version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/launcher/Cargo.toml | head -1)
          if [ "$tag" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match crates/launcher/Cargo.toml (version $cargo). Bump the version first."
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml

  publish:
    name: Sign and publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir dist
          # Plain names: these are what people's browsers save.
          cp artifacts/launcher-windows-x86_64/exile.exe dist/exile.exe
          cp artifacts/launcher-linux-x86_64/exile dist/exile
          chmod +x dist/exile
          # For people on Linux: a tarball keeps the executable bit. The launcher updates from the bare binary.
          tar -C dist -czf dist/exile-linux.tar.gz exile
          cp artifacts/client-jar/exile-client-*.jar dist/exile-client.jar
          ls -l dist

      - name: Release notes from the tag message
        run: |
          git fetch --force --tags
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d' > notes.txt
          [ -s notes.txt ] || echo "Bug fixes and improvements." > notes.txt
          cat notes.txt

      - name: Sign and write update.json
        env:
          SIGNING_KEY: ${{ secrets.EXILE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The EXILE_SIGNING_KEY secret isn't set (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/signing-key.pem"
          client=$(sed -n 's/^mod_version=//p' client/gradle.properties)
          python3 .github/scripts/update_manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --key "$RUNNER_TEMP/signing-key.pem" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME" \
            --notes notes.txt --client "$client" --out dist/update.json \
            windows-x86_64=dist/exile.exe \
            linux-x86_64=dist/exile
          rm -f "$RUNNER_TEMP/signing-key.pem"
          cat dist/update.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Exile ${GITHUB_REF_NAME#v}" \
            --notes-file notes.txt \
            --verify-tag
