[package]
name = "exile-launcher"
version = "0.2.8"
edition = "2024"
description = "Exile Launcher - a fast, native Minecraft launcher"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "exile"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.23"
directories = "6"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
exile-ui = { path = "../ui" }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
getrandom = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
# Signs the badge service's one-time id with the account's chat key (badges.rs).
# RUSTSEC-2023-0071 (a timing side channel) needs many timed private-key
# operations over a network; Exile signs once per sign-in, locally, with a key
# Mojang replaces every few days.
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.11"
sha2 = "0.11"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
toml = "1"
ureq = { version = "3", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".build-dependencies]
png = "0.18"
winresource = "0.1"

[target."cfg(windows)".dependencies]
winreg = "0.56"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
