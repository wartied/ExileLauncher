[package]
name = "exile-installer"
# The installer shows and registers the launcher's version (see build.rs).
version = "0.1.0"
edition = "2024"
description = "Exile's installer for Windows"
license = "GPL-3.0-only"
publish = false

[[bin]]
name = "exile-setup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
sha2 = "0.11"

[target."cfg(windows)".dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
exile-ui = { path = "../ui" }
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
winreg = "0.56"

[target."cfg(windows)".build-dependencies]
png = "0.18"
winresource = "0.1"
